name: CELayer
options:
  bundleIdPrefix: com.celayer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_C_LANGUAGE_STANDARD: c11
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CELayer:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Core
        excludes:
          - include
    headers:
      public:
        - Sources/Core/include/CELayer/*.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.celayer.ios
        PRODUCT_NAME: CELayer
        SWIFT_OBJC_BRIDGING_HEADER: Sources/iOS/CELayer-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/Core/include"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CELayer
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Windows CE Executable
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  CELayer:
    build:
      targets:
        CELayer: all
    run:
      config: Debug
    archive:
      config: Release
